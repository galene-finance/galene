<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/brand/galene-icon-180.png" />
		<meta name="theme-color" content="#0d9488" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Galene" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- ADO-21: first-paint containment BEFORE Tailwind (FOUC desktop nav / chart
			intrinsic width). Kept even though Simulator Safari did not repro —
			cheap insurance. Primary open signal is Firefox iOS layout viewport
			vs visualViewport (Desktop Site). -->
		<style>
			html,
			body {
				width: 100%;
				max-width: 100%;
				min-height: 100%;
				margin: 0;
				overflow-x: hidden;
				overflow-x: clip;
			}
			.galene-nav-desktop {
				display: none !important;
			}
			@media (min-width: 1024px) {
				.galene-nav-desktop {
					display: flex !important;
				}
			}
			svg.galene-chart {
				display: block;
				width: 100%;
				max-width: 100%;
				height: auto;
			}
			.galene-scroll-x {
				max-width: 100%;
				overflow-x: auto;
				-webkit-overflow-scrolling: touch;
			}
			.galene-shell {
				position: relative;
				width: 100%;
				max-width: 100%;
				min-height: 100%;
				min-height: 100vh;
				overflow-x: hidden;
				overflow-x: clip;
			}
			/* When Firefox (or any UA) uses a desktop layout viewport wider than
			   the screen, html.galene-vv-clamp locks to --vvw (visual width). */
			html.galene-vv-clamp,
			html.galene-vv-clamp body,
			html.galene-vv-clamp .galene-shell {
				max-width: var(--vvw, 100%) !important;
				width: var(--vvw, 100%) !important;
				overflow-x: hidden !important;
			}
		</style>
		<script>
			// ADO-21: Firefox iOS Desktop Site (and similar) can give a layout
			// viewport much wider than visualViewport. Clamp root to visual
			// width when that gap appears. No 100vw; no minimum-scale hacks.
			(function () {
				var root = document.documentElement;
				function visualWidth() {
					var vv = window.visualViewport;
					if (vv && vv.width > 0) return vv.width;
					return 0;
				}
				function layoutWidth() {
					return Math.max(
						root.clientWidth || 0,
						window.innerWidth || 0,
						document.body ? document.body.clientWidth || 0 : 0
					);
				}
				function kick() {
					var vis = visualWidth();
					if (!(vis > 0)) return;
					root.style.setProperty('--vvw', vis + 'px');
					var layout = layoutWidth();
					// Desktop-site / wrong-first-paint signature: layout >> visual
					if (layout > vis + 8) {
						root.classList.add('galene-vv-clamp');
					} else {
						root.classList.remove('galene-vv-clamp');
					}
					void root.offsetWidth;
				}
				kick();
				if (window.visualViewport) {
					window.visualViewport.addEventListener('resize', kick);
					window.visualViewport.addEventListener('scroll', kick);
				}
				window.addEventListener('resize', kick);
				window.addEventListener('orientationchange', kick);
				window.addEventListener('pageshow', kick);
				window.addEventListener('load', kick);
				if (typeof requestAnimationFrame === 'function') {
					requestAnimationFrame(function () {
						requestAnimationFrame(kick);
					});
				} else {
					setTimeout(kick, 0);
				}
				// A few delayed kicks: Firefox sometimes settles viewport late.
				setTimeout(kick, 50);
				setTimeout(kick, 250);
				setTimeout(kick, 1000);
			})();
		</script>
		<script>
			// ADO-21: ?ado21debug=1 outlines elements past the viewport.
			(function () {
				if (!/[?&]ado21debug=1(?:&|$)/.test(location.search)) return;
				function paint() {
					var vw =
						(window.visualViewport && window.visualViewport.width) ||
						document.documentElement.clientWidth;
					document.querySelectorAll('[data-ado21]').forEach(function (el) {
						el.removeAttribute('data-ado21');
						el.style.outline = '';
					});
					var list = [];
					document.querySelectorAll('body *').forEach(function (el) {
						var r = el.getBoundingClientRect();
						if (r.width < 2 || r.height < 2) return;
						if (r.right > vw + 1 || el.scrollWidth > el.clientWidth + 1) {
							el.setAttribute('data-ado21', '1');
							el.style.outline = '2px solid magenta';
							list.push({
								tag: el.tagName,
								cls: (typeof el.className === 'string' ? el.className : '').slice(0, 80),
								right: Math.round(r.right),
								sw: el.scrollWidth,
								cw: el.clientWidth
							});
						}
					});
					list.sort(function (a, b) {
						return b.right - a.right;
					});
					console.log(
						'[ado21debug] vis=' +
							Math.round(vw) +
							' layout=' +
							document.documentElement.clientWidth +
							' clamp=' +
							document.documentElement.classList.contains('galene-vv-clamp') +
							' offenders',
						list.slice(0, 20)
					);
				}
				window.addEventListener('load', function () {
					paint();
					setTimeout(paint, 300);
					setTimeout(paint, 1000);
				});
			})();
		</script>
		<script>
			/* Apply the last usable built-in theme before first paint. Colors are
			   inlined (same values as DEFAULT_THEMES) so the page does not wait
			   on /theme.css. galene-theme-slug covers a user-theme id after
			   sign-out, when that id's stylesheet would 404. Keep this script
			   in sync with themeBootstrapScript() in src/lib/themes.ts. */
			(function(){var css={"light":"html[data-theme='light'] {\n\t--background: #f8fafc;\n\t--surface: #ffffff;\n\t--surface-hover: #f1f5f9;\n\t--muted: #f1f5f9;\n\t--border: #e2e8f0;\n\t--input: #cbd5e1;\n\t--foreground: #1e293b;\n\t--muted-foreground: #64748b;\n\t--primary: #0d9488;\n\t--primary-foreground: #ffffff;\n\t--success: #16a34a;\n\t--destructive: #dc2626;\n\t--destructive-foreground: #ffffff;\n\t--warning: #f59e0b;\n\t--ring: #0d9488;\n\t--radius: 0.5rem;\n}","dark":"html[data-theme='dark'] {\n\t--background: #0f172a;\n\t--surface: #1e293b;\n\t--surface-hover: #263349;\n\t--muted: #263349;\n\t--border: #334155;\n\t--input: #475569;\n\t--foreground: #e2e8f0;\n\t--muted-foreground: #94a3b8;\n\t--primary: #2dd4bf;\n\t--primary-foreground: #0f172a;\n\t--success: #4ade80;\n\t--destructive: #f87171;\n\t--destructive-foreground: #ffffff;\n\t--warning: #fbbf24;\n\t--ring: #2dd4bf;\n\t--radius: 0.5rem;\n}","forest":"html[data-theme='forest'] {\n\t--background: #0a120e;\n\t--surface: #101a14;\n\t--surface-hover: #18261d;\n\t--muted: #18261d;\n\t--border: #1e2f24;\n\t--input: #24382c;\n\t--foreground: #e8f2ec;\n\t--muted-foreground: #8fa89a;\n\t--primary: #22ff88;\n\t--primary-foreground: #06130c;\n\t--success: #4ade80;\n\t--destructive: #f87171;\n\t--destructive-foreground: #ffffff;\n\t--warning: #fbbf24;\n\t--ring: #22ff88;\n\t--radius: 0.5rem;\n}","ocean":"html[data-theme='ocean'] {\n\t--background: #0a1220;\n\t--surface: #101a2c;\n\t--surface-hover: #18243a;\n\t--muted: #18243a;\n\t--border: #1e2a40;\n\t--input: #243350;\n\t--foreground: #e2e8f0;\n\t--muted-foreground: #8494ab;\n\t--primary: #3b82f6;\n\t--primary-foreground: #ffffff;\n\t--success: #34d399;\n\t--destructive: #f87171;\n\t--destructive-foreground: #ffffff;\n\t--warning: #fbbf24;\n\t--ring: #3b82f6;\n\t--radius: 0.5rem;\n}","rose":"html[data-theme='rose'] {\n\t--background: #fdf2f6;\n\t--surface: #ffffff;\n\t--surface-hover: #fce7ef;\n\t--muted: #fce7ef;\n\t--border: #f3d3de;\n\t--input: #e8b4c6;\n\t--foreground: #3f1d2b;\n\t--muted-foreground: #9d6b80;\n\t--primary: #db2777;\n\t--primary-foreground: #ffffff;\n\t--success: #16a34a;\n\t--destructive: #dc2626;\n\t--destructive-foreground: #ffffff;\n\t--warning: #f59e0b;\n\t--ring: #db2777;\n\t--radius: 0.5rem;\n}","graphite":"html[data-theme='graphite'] {\n\t--background: #111315;\n\t--surface: #1a1d20;\n\t--surface-hover: #23272b;\n\t--muted: #23272b;\n\t--border: #2c3136;\n\t--input: #3a4046;\n\t--foreground: #e5e7ea;\n\t--muted-foreground: #9aa1a9;\n\t--primary: #f59e0b;\n\t--primary-foreground: #1a1205;\n\t--success: #4ade80;\n\t--destructive: #f87171;\n\t--destructive-foreground: #ffffff;\n\t--warning: #fbbf24;\n\t--ring: #f59e0b;\n\t--radius: 0.5rem;\n}"};try{var t=localStorage.getItem("galene-theme");var s=localStorage.getItem("galene-theme-slug");var slug=(t&&css[t])?t:((s&&css[s])?s:null);if(!slug)return;document.documentElement.dataset.theme=slug;var st=document.createElement("style");st.id="theme-critical";st.textContent=css[slug];document.head.appendChild(st);if(t&&!css[t]&&/^\d+$/.test(t)){var link=document.createElement("link");link.id="theme-css";link.rel="stylesheet";link.href="/theme.css?theme="+encodeURIComponent(t);document.head.appendChild(link);}}catch(e){}})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit:load data-sveltekit:body>
		<div class="galene-shell min-h-screen min-w-0 w-full max-w-full overflow-x-hidden overflow-x-clip">%sveltekit.body%</div>
	</body>
</html>
