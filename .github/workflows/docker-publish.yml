# Publishes the Galene app image to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:<ver>|-latest
#
# Flow (#157 — dual-publish during cutover; drop app- prefix):
#   push to `test`  -> :test + :app-test (mutable) plus
#                      :test-<sha> + :app-test-<sha> (immutable)
#   merge to `main` -> :latest + :app-latest (+ :main + :app-main)
#   tag v*          -> :<ver> + :app-<ver> (release; see release.yml)
#
# After hosts/docs cut over to unprefixed tags, the :app-* aliases can be
# removed from this workflow in a follow-up. Historical :mcp-* tags stay
# in the registry; no :mcp-* image is published.
#
# MCP HTTP lives in the app image at /mcp when enabled in Settings (default off).
#
# For a private beta repo this works out of the box: GITHUB_TOKEN can publish
# to the workflow's own repository. Pulling the images from *another* machine
# (e.g. your home server) requires a classic PAT with read:packages —
# fine-grained tokens cannot access GHCR.
#
# The image is multi-arch (linux/amd64 + linux/arm64) so amd64 and
# Apple Silicon / arm64 hosts each get a native image. Keep both
# platforms in the build steps below (buildx + QEMU are set up for that).

name: Docker

on:
  push:
    branches: [main, test]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for the arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          # v1.2.3 -> 1.2.3; branch pushes keep the branch name
          if [[ "$ref" =~ ^v[0-9] ]]; then ver="${ref#v}"; else ver="$ref"; fi
          base="${{ env.REGISTRY }}/${{ github.repository }}"
          # Dual-publish unprefixed (new) + app-* (legacy) during #157 cutover
          app_tags="$base:$ver,$base:app-$ver"
          # build-push-action wants comma-separated tags
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            app_tags="$app_tags,$base:latest,$base:app-latest"
          elif [[ ! "$ref" =~ ^v[0-9] ]]; then
            # Branch builds (e.g. test) also get an immutable per-commit tag
            # so a specific build can be pinned; the branch-name tag stays
            # "latest on that branch".
            sha="${GITHUB_SHA:0:7}"
            app_tags="$app_tags,$base:${ver}-${sha},$base:app-${ver}-${sha}"
          fi
          # Version baked into the app and stamped as an OCI label: the tag
          # when publishing from a tag, otherwise package.json (the single
          # source of truth, bumped by the release workflow).
          if [[ "$ref" =~ ^v[0-9] ]]; then
            app_version="${ref#v}"
          else
            app_version="$(node -p "require('./package.json').version")"
          fi
          echo "app=$app_tags" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.app }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.app_version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.tags.outputs.build_date }}
          # Links the package to this repository (avoids the "package was
          # pushed without a repo link" warning if it was ever pushed CLI-side)
          labels: org.opencontainers.image.repos=${{ env.REGISTRY }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
