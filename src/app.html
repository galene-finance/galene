<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- ADO-21: containment before any stylesheet so first paint can't scroll wide. -->
		<style>
			html,
			body {
				width: 100%;
				max-width: 100%;
				min-height: 100%;
				overflow-x: clip;
				margin: 0;
			}
		</style>
		<script>
			// ADO-21: first-load horizontal overflow on Firefox iOS. Prefer
			// visualViewport.width for --vvw (dropdown caps, etc.). Do not fall
			// back to innerWidth — that can match a desktop layout width when
			// Desktop Site is on or half-applied. A later resize (incl. after
			// toggling Desktop Site) updates --vvw; overflow-x clip is the
			// always-on guard either way.
			(function () {
				var root = document.documentElement;
				function measure() {
					var vv = window.visualViewport;
					if (vv && vv.width > 0) {
						root.style.setProperty('--vvw', vv.width + 'px');
						return;
					}
					var w = root.clientWidth;
					if (w > 0 && w < 480) root.style.setProperty('--vvw', w + 'px');
				}
				function kick() {
					measure();
					void root.offsetWidth;
				}
				measure();
				if (window.visualViewport) {
					window.visualViewport.addEventListener('resize', kick);
					window.visualViewport.addEventListener('scroll', measure);
				}
				window.addEventListener('resize', kick);
				window.addEventListener('orientationchange', kick);
				window.addEventListener('pageshow', kick);
				window.addEventListener('load', kick);
				if (typeof requestAnimationFrame === 'function') {
					requestAnimationFrame(function () {
						requestAnimationFrame(kick);
					});
				} else {
					setTimeout(kick, 0);
				}
			})();
		</script>
		<script>
			// Apply the last-used theme before first paint. The stored value is
			// a default theme slug or a user theme id; the matching stylesheet
			// is loaded here so the theme is visible before hydration. Unknown
			// values (e.g. a user theme id after signing out) simply have no
			// CSS and fall back to the :root defaults.
			(function () {
				var t = localStorage.getItem('galene-theme');
				if (!t) return;
				document.documentElement.dataset.theme = t;
				var link = document.createElement('link');
				link.id = 'theme-css';
				link.rel = 'stylesheet';
				link.href = '/theme.css?theme=' + encodeURIComponent(t);
				document.head.appendChild(link);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit:load data-sveltekit:body>
		<div class="min-h-screen min-w-0 w-full max-w-full overflow-x-clip">%sveltekit.body%</div>
	</body>
</html>
