<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- ADO-21: first-paint containment BEFORE Tailwind. Desktop nav uses
			Tailwind `hidden lg:flex`; without CSS it renders as a long row and
			overflows. Same for chart SVGs that only get width from `w-full`. -->
		<style>
			html,
			body {
				width: 100%;
				max-width: 100%;
				min-height: 100%;
				margin: 0;
				overflow-x: hidden; /* widely supported; clip alone is flaky on iOS */
				overflow-x: clip;
			}
			/* FOUC-proof: hide desktop horizontal nav below lg */
			.galene-nav-desktop {
				display: none !important;
			}
			@media (min-width: 1024px) {
				.galene-nav-desktop {
					display: flex !important;
				}
			}
			/* Chart SVGs: viewBox alone can intrinsic-size to 720px before utilities */
			svg.galene-chart {
				display: block;
				width: 100%;
				max-width: 100%;
				height: auto;
			}
			/* Wide tables/calendars: contain horizontal scroll without Tailwind */
			.galene-scroll-x {
				max-width: 100%;
				overflow-x: auto;
				-webkit-overflow-scrolling: touch;
			}
			/* SO-style inner shell: overflow + position, no Tailwind required */
			.galene-shell {
				position: relative;
				width: 100%;
				max-width: 100%;
				min-height: 100%;
				min-height: 100vh;
				overflow-x: hidden;
				overflow-x: clip;
			}
		</style>
		<script>
			// ADO-21: --vvw from visualViewport for component max-widths.
			// Do not fall back to innerWidth (can be a desktop-layout width).
			// Root overflow + FOUC-proof nav/chart CSS are the main guards.
			(function () {
				var root = document.documentElement;
				function measure() {
					var vv = window.visualViewport;
					if (vv && vv.width > 0) {
						root.style.setProperty('--vvw', vv.width + 'px');
						return;
					}
					var w = root.clientWidth;
					if (w > 0 && w < 480) root.style.setProperty('--vvw', w + 'px');
				}
				function kick() {
					measure();
					void root.offsetWidth;
				}
				measure();
				if (window.visualViewport) {
					window.visualViewport.addEventListener('resize', kick);
					window.visualViewport.addEventListener('scroll', measure);
				}
				window.addEventListener('resize', kick);
				window.addEventListener('orientationchange', kick);
				window.addEventListener('pageshow', kick);
				window.addEventListener('load', kick);
				if (typeof requestAnimationFrame === 'function') {
					requestAnimationFrame(function () {
						requestAnimationFrame(kick);
					});
				} else {
					setTimeout(kick, 0);
				}
			})();
		</script>
		<script>
			// ADO-21: ?ado21debug=1 outlines elements past the viewport (device diagnose).
			(function () {
				if (!/[?&]ado21debug=1(?:&|$)/.test(location.search)) return;
				function paint() {
					var vw = document.documentElement.clientWidth;
					document.querySelectorAll('[data-ado21]').forEach(function (el) {
						el.removeAttribute('data-ado21');
						el.style.outline = '';
					});
					var list = [];
					document.querySelectorAll('body *').forEach(function (el) {
						var r = el.getBoundingClientRect();
						if (r.width < 2 || r.height < 2) return;
						if (r.right > vw + 1 || el.scrollWidth > el.clientWidth + 1) {
							el.setAttribute('data-ado21', '1');
							el.style.outline = '2px solid magenta';
							list.push({
								tag: el.tagName,
								cls: (typeof el.className === 'string' ? el.className : '').slice(0, 80),
								right: Math.round(r.right),
								sw: el.scrollWidth,
								cw: el.clientWidth
							});
						}
					});
					list.sort(function (a, b) { return b.right - a.right; });
					console.log('[ado21debug] vw=' + vw + ' offenders', list.slice(0, 20));
				}
				window.addEventListener('load', function () {
					paint();
					setTimeout(paint, 300);
					setTimeout(paint, 1000);
				});
			})();
		</script>
		<script>
			// Apply the last-used theme before first paint. The stored value is
			// a default theme slug or a user theme id; the matching stylesheet
			// is loaded here so the theme is visible before hydration. Unknown
			// values (e.g. a user theme id after signing out) simply have no
			// CSS and fall back to the :root defaults.
			(function () {
				var t = localStorage.getItem('galene-theme');
				if (!t) return;
				document.documentElement.dataset.theme = t;
				var link = document.createElement('link');
				link.id = 'theme-css';
				link.rel = 'stylesheet';
				link.href = '/theme.css?theme=' + encodeURIComponent(t);
				document.head.appendChild(link);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit:load data-sveltekit:body>
		<div class="galene-shell min-h-screen min-w-0 w-full max-w-full overflow-x-hidden overflow-x-clip">%sveltekit.body%</div>
	</body>
</html>
